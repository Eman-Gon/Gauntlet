[project]
name = "gauntlet"
version = "0.1.0"
description = "Gauntlet — Autonomous burden of proof for the agentic web. Reuses the Receipts cost-aware inference cascade."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "httpx",
    "trafilatura",
    "openai",
    "anthropic",
    "tavily-python",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "python-dotenv",
    "orjson",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
